<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCanje Pro | Gestión de Canjes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #eef2f8; min-height: 100vh; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0f2b3a 0%, #1a4a62 100%); }
        .login-card { background: white; border-radius: 32px; padding: 40px 35px; width: 420px; max-width: 90%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .login-icon { background: linear-gradient(135deg, #1b6b8f, #2c7da0); width: 70px; height: 70px; border-radius: 25px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .login-icon i { font-size: 35px; color: white; }
        .login-card h1 { font-size: 26px; color: #1b6b8f; }
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group input { width: 100%; padding: 12px 16px; border: 2px solid #e2edf2; border-radius: 28px; }
        .btn-login { width: 100%; background: linear-gradient(135deg, #2c7da0, #1b5e7a); color: white; border: none; padding: 12px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .demo-creds { background: #f0f6fa; border-radius: 20px; padding: 12px; margin-top: 20px; font-size: 11px; text-align: left; }
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: linear-gradient(180deg, #0a2b36 0%, #0f3b4a 100%); color: white; padding: 24px 18px; }
        .logo { font-size: 1.3rem; font-weight: 700; margin-bottom: 35px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2c6a84; padding-bottom: 18px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; margin: 5px 0; border-radius: 14px; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: #2c7da0; }
        .main-content { flex: 1; padding: 18px 24px; overflow-x: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 22px; border-radius: 28px; margin-bottom: 20px; }
        .logout-btn { background: #e74c3c; border: none; padding: 7px 18px; border-radius: 28px; color: white; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 20px; padding: 14px; text-align: center; }
        .stat-card h3 { font-size: 1.6rem; font-weight: 700; color: #1f5068; }
        .stat-card p { font-size: 0.7rem; color: #5b7a92; }
        .card { background: white; border-radius: 20px; padding: 18px; margin-bottom: 20px; }
        .card h3 { font-weight: 600; margin-bottom: 14px; border-left: 4px solid #2c7da0; padding-left: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #e9eff4; }
        th { background: #f8fafc; font-weight: 600; }
        .btn-primary { background: #2c7da0; color: white; border: none; padding: 5px 14px; border-radius: 25px; cursor: pointer; font-size: 0.7rem; }
        .btn-danger { background: #c0392b; }
        .badge-junio { background: #27ae60; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; display: inline-block; }
        .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .filtros input, .filtros select { padding: 6px 12px; border-radius: 25px; border: 1px solid #cbdde6; font-size: 0.7rem; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #2c7da0; color: white; padding: 10px 18px; border-radius: 30px; z-index: 1000; }
        @media (max-width: 768px) { .sidebar { width: 70px; } .sidebar span:not(.logo-icon) { display: none; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    const BOTICAS = ["UNION", "LIBERTAD POMALCA", "VILLARREAL", "INCAS", "FORTALEZA POMALCA", "LAMBAYEQUE 2", "P.C", "LIBERTAD - LA VICTORIA"];

const GOOGLE_SHEETS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSo6ZluYoz8urGFCNinRJmIGepUZjwc-cHNOyBIIR7AbnqFDzf8EbB3SSgecacw6A/pub?output=csv";
    
    let productos = [];
    let users = [
        { id: "u1", username: "admin", password: "admin123", rol: "admin", nombre: "Administrador", boticaAsignada: null },
        { id: "u2", username: "supervisor", password: "super123", rol: "supervisor", nombre: "Supervisora", boticaAsignada: null },
        { id: "u3", username: "union", password: "union123", rol: "usuario", nombre: "Botica Unión", boticaAsignada: "UNION" },
        { id: "u4", username: "libertad", password: "lib123", rol: "usuario", nombre: "Botica Libertad", boticaAsignada: "LIBERTAD POMALCA" }
    ];
    
    let mensajes = [];
    let notificaciones = [];
    let currentUser = null;
    
    function saveUsers() { localStorage.setItem("pharma_users", JSON.stringify(users)); }
    function saveProductos() { localStorage.setItem("pharma_productos", JSON.stringify(productos)); }
    function saveMensajes() { localStorage.setItem("pharma_mensajes", JSON.stringify(mensajes)); }
    function saveNotificaciones() { localStorage.setItem("pharma_notificaciones", JSON.stringify(notificaciones)); }
    
    function mostrarToast(mensaje) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerHTML = mensaje;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    // IMPORTAR EXCEL
    window.importarExcel = function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx, .xls, .csv';
        input.onchange = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                    
                    const nuevosProductos = [];
                    for(let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if(row[1] && row[1].toString().trim() !== "") {
                            nuevosProductos.push({
                                id: "p"+Date.now()+i,
                                nombre: (row[1] || "Producto").toString().substring(0,80),
                                cantidad: parseInt(row[2]) || 1,
                                fechaVenc: row[3] ? new Date(row[3]).toISOString().split('T')[0] : "2026-12-31",
                                lote: row[4] ? row[4].toString() : "LOTE",
                                laboratorio: row[5] ? row[5].toString() : "LAB",
                                local: row[6] ? row[6].toString() : "UNION",
                                canje: row[7] ? row[7].toString() : "PENDIENTE",
                                proveedor: row[8] ? row[8].toString() : "",
                                factura: row[9] ? row[9].toString() : "",
                                obs: row[10] ? row[10].toString() : ""
                            });
                        }
                    }
                    
                    if(nuevosProductos.length > 0) {
                        productos = nuevosProductos;
                        saveProductos();
                        mostrarToast(`✅ ${nuevosProductos.length} productos importados`);
                        renderMainApp();
                    } else {
                        alert("No se encontraron datos. Verifica que el archivo tenga los datos en las columnas correctas.");
                    }
                } catch(error) {
                    alert("Error al leer el archivo: " + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    };
    
    window.exportarExcel = function() {
        const wsData = [["LOCAL", "PRODUCTO", "CANTIDAD", "LOTE", "LABORATORIO", "CANJE", "PROVEEDOR", "FACTURA"]];
        productos.forEach(p => {
            wsData.push([p.local, p.nombre, p.cantidad, p.lote, p.laboratorio, p.canje, p.proveedor || "", p.factura || ""]);
        });
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Productos");
        XLSX.writeFile(wb, `productos_${new Date().toISOString().slice(0,10)}.xlsx`);
        mostrarToast("Exportación completada");
    };
    
    window.doLogin = function() {
        const user = document.getElementById("loginUser").value;
        const pass = document.getElementById("loginPass").value;
        const found = users.find(u => u.username === user && u.password === pass);
        if(found) {
            currentUser = { ...found };
            localStorage.setItem("currentUser", JSON.stringify(currentUser));
            renderMainApp();
        } else alert("❌ Credenciales incorrectas");
    };
    
    function logout() { currentUser = null; localStorage.removeItem("currentUser"); renderLogin(); }
    
    function renderLogin() {
        document.getElementById("root").innerHTML = `
            <div class="login-container">
                <div class="login-card">
                    <div class="login-icon"><i class="fas fa-pills"></i></div>
                    <h1>PharmaCanje Pro</h1>
                    <p>Sistema de gestión de canjes</p>
                    <div class="input-group"><input type="text" id="loginUser" placeholder="Usuario"></div>
                    <div class="input-group"><input type="password" id="loginPass" placeholder="Contraseña"></div>
                    <button class="btn-login" onclick="doLogin()">Ingresar</button>
                    <div class="demo-creds"><strong>🔐 Credenciales:</strong><br>admin / admin123 | supervisor / super123<br>union / union123 | libertad / lib123</div>
                    <div class="demo-creds" style="margin-top:8px; background:#e8f4f8;"><strong>📌 IMPORTANTE:</strong><br>1. Ingresa como ADMIN<br>2. Ve a "Admin Panel"<br>3. Haz clic en "IMPORTAR EXCEL"</div>
                </div>
            </div>`;
    }
    
    function renderMainApp() {
        if(!currentUser) { renderLogin(); return; }
        const isAdmin = currentUser.rol === "admin";
        const isSupervisor = currentUser.rol === "supervisor";
        
        let sidebarHtml = `<div class="logo"><i class="fas fa-pills"></i><span>PharmaCanje</span></div>`;
        const menus = [
            { id: "dashboard", icon: "fa-chart-line", label: "Dashboard" },
            { id: "verBoticas", icon: "fa-store", label: "Ver Boticas" }
        ];
        if(isAdmin || isSupervisor) menus.push({ id: "verificar", icon: "fa-check-double", label: "Verificar" });
        if(isAdmin) menus.push({ id: "adminPanel", icon: "fa-user-shield", label: "Admin Panel" });
        
        menus.forEach(m => { sidebarHtml += `<div class="nav-item" data-tab="${m.id}"><i class="fas ${m.icon}"></i><span>${m.label}</span></div>`; });
        
        document.getElementById("root").innerHTML = `
            <div class="app-container"><div class="sidebar">${sidebarHtml}</div>
            <div class="main-content"><div class="top-bar">
                <div><strong>${isAdmin ? "ADMINISTRADOR" : (isSupervisor ? "SUPERVISORA" : "USUARIO")}</strong></div>
                <button class="logout-btn" onclick="logout()">Salir</button>
            </div><div id="dynamicContent"></div></div></div>`;
        
        document.querySelectorAll(".nav-item").forEach(nav => {
            nav.addEventListener("click", () => {
                document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
                nav.classList.add("active");
                const tab = nav.dataset.tab;
                if(tab === "dashboard") renderDashboard();
                else if(tab === "verBoticas") renderVerBoticas();
                else if(tab === "verificar") renderVerificar();
                else if(tab === "adminPanel") renderAdminPanel();
            });
        });
        renderDashboard();
    }
    
    function renderDashboard() {
        const total = productos.length;
        const unidades = productos.reduce((a,b)=>a+(Number(b.cantidad)||0),0);
        const junio = productos.filter(p=>p.canje==="JUNIO").length;
        
        const html = `
            <div class="stats-grid">
                <div class="stat-card"><h3>${total}</h3><p>Productos</p></div>
                <div class="stat-card"><h3>${unidades}</h3><p>Unidades</p></div>
                <div class="stat-card"><h3>${junio}</h3><p>Canje JUNIO</p></div>
                <div class="stat-card"><h3>${productos.filter(p=>p.canje==="PENDIENTE").length}</h3><p>Pendientes</p></div>
            </div>
            <div class="card"><h3>📋 Últimos productos</h3><div style="overflow-x:auto;"><table><thead><th>Local</th><th>Producto</th><th>Cant</th><th>Canje</th></thead><tbody>
            ${productos.slice(0,10).map(p => `<tr>
                <td>${p.local}</td
                <td>${p.nombre.substring(0,40)}</td
                <td>${p.cantidad}</td
                <td>${p.canje}</td
            </tr>`).join('')}
            </tbody></table></div></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    function renderVerBoticas() {
        const html = `
            <div class="card"><h3>🏪 Todas las Boticas (${productos.length} productos)</h3>
            <div class="filtros">
                <select id="filtroLocal"><option value="TODOS">Todas</option>${BOTICAS.map(b=>`<option value="${b}">${b}</option>`).join('')}</select>
                <input type="text" id="filtroLab" placeholder="Laboratorio...">
                <button class="btn-primary" onclick="exportarExcel()">Exportar</button>
            </div>
            <div style="overflow-x:auto;"><table><thead><th>Local</th><th>Producto</th><th>Cant</th><th>Lote</th><th>Lab</th><th>Canje</th></thead><tbody id="tablaBody"></tbody></table></div></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
        filtrarTabla();
        document.getElementById("filtroLocal")?.addEventListener("change", filtrarTabla);
        document.getElementById("filtroLab")?.addEventListener("input", filtrarTabla);
    }
    
    function filtrarTabla() {
        const local = document.getElementById("filtroLocal")?.value || "TODOS";
        const lab = (document.getElementById("filtroLab")?.value || "").toLowerCase();
        let filtrados = productos;
        if(local !== "TODOS") filtrados = filtrados.filter(p => p.local === local);
        if(lab) filtrados = filtrados.filter(p => p.laboratorio.toLowerCase().includes(lab));
        
        document.getElementById("tablaBody").innerHTML = filtrados.map(p => `<tr>
            <td>${p.local}</td
            <td>${p.nombre.substring(0,50)}</td
            <td>${p.cantidad}</td
            <td>${p.lote}</td
            <td>${p.laboratorio}</td
            <td><span class="badge-junio">${p.canje}</span></td
        </tr>`).join('');
    }
    
    function renderVerificar() {
        const html = `
            <div class="card"><h3>✅ Verificar Productos (${productos.length})</h3>
            <div class="filtros"><input type="text" id="buscarVerif" placeholder="Buscar..."></div>
            <div style="overflow-x:auto;"><table style="width:100%"><thead><th>Local</th><th>Producto</th><th>Cant</th><th>Canje</th><th>Proveedor</th><th>Factura</th><th>Acción</th></thead><tbody id="verifBody"></tbody></table></div></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
        cargarVerificacion();
        document.getElementById("buscarVerif")?.addEventListener("input", cargarVerificacion);
    }
    
    function cargarVerificacion() {
        const busqueda = document.getElementById("buscarVerif")?.value.toLowerCase() || "";
        let filtrados = productos.filter(p => p.nombre.toLowerCase().includes(busqueda));
        
        document.getElementById("verifBody").innerHTML = filtrados.map(p => `
            <tr>
                <td>${p.local}</td
                <td>${p.nombre.substring(0,35)}</td
                <td>${p.cantidad}</td
                <td><input type="text" id="canje_${p.id}" value="${p.canje}" style="width:70px"></td
                <td><input type="text" id="prov_${p.id}" value="${p.proveedor||''}" style="width:90px"></td
                <td><input type="text" id="fact_${p.id}" value="${p.factura||''}" style="width:90px"></td
                <td><button class="btn-primary" onclick="guardarProducto('${p.id}')">Guardar</button></td
            </tr>
        `).join('');
    }
    
    window.guardarProducto = function(id) {
        const prod = productos.find(p=>p.id===id);
        if(prod) {
            prod.canje = document.getElementById(`canje_${id}`).value;
            prod.proveedor = document.getElementById(`prov_${id}`).value;
            prod.factura = document.getElementById(`fact_${id}`).value;
            saveProductos();
            mostrarToast("✅ Producto actualizado");
            cargarVerificacion();
        }
    };
    
    function renderAdminPanel() {
        const html = `<div class="card"><h3>👑 Administración</h3>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="btn-primary" onclick="importarExcel()">📂 Importar Excel</button>
                <button class="btn-primary" onclick="exportarExcel()">📥 Exportar Datos</button>
                <button class="btn-primary" onclick="crearUsuario()">👤 Crear Usuario</button>
            </div>
            <h4>👥 Usuarios</h4><div style="overflow-x:auto;"><td><thead><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Botica</th></thead><tbody>
            ${users.map(u => `<tr>
                <td>${u.username}</td
                <td>${u.nombre}</td
                <td>${u.rol}</td
                <td>${u.boticaAsignada || '-'}</td
                <td><button class="btn-danger" onclick="eliminarUsuario('${u.id}')">Eliminar</button></td
            </tr>`).join('')}
            </tbody></table></div></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.crearUsuario = function() {
        let username = prompt("Usuario"); if(!username) return;
        let pass = prompt("Contraseña");
        let rol = prompt("Rol (admin/supervisor/usuario)");
        if(!["admin","supervisor","usuario"].includes(rol.toLowerCase())) { alert("Rol inválido"); return; }
        let nombre = prompt("Nombre completo");
        let botica = rol === "usuario" ? prompt("Botica: " + BOTICAS.join(", ")) : null;
        users.push({ id: "u"+Date.now(), username, password: pass, rol, nombre, boticaAsignada: botica });
        saveUsers();
        renderAdminPanel();
    };
    
    window.eliminarUsuario = function(id) { users = users.filter(u=>u.id!==id); saveUsers(); renderAdminPanel(); };
    
    function init() {
        const storedUsers = localStorage.getItem("pharma_users");
        if(storedUsers) users = JSON.parse(storedUsers);
        else localStorage.setItem("pharma_users", JSON.stringify(users));
        const storedProductos = localStorage.getItem("pharma_productos");
        if(storedProductos) productos = JSON.parse(storedProductos);
        else localStorage.setItem("pharma_productos", JSON.stringify(productos));
        
        const storedUser = localStorage.getItem("currentUser");
        if(storedUser) { currentUser = JSON.parse(storedUser); renderMainApp(); }
        else renderLogin();
    }
    
    init();
</script>
</body>
</html>
